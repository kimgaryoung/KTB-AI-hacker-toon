# TLS 설정. 인증서를 발급받은 뒤 NGINX_CONF=nginx.tls.conf 로 전환해서 쓴다.
# deploy/init-letsencrypt.sh 참고.
server {
    listen 80;
    server_name ktb-ai-hackathon-team14.com www.ktb-ai-hackathon-team14.com;

    # 갱신 챌린지는 http로 들어오므로 리다이렉트보다 먼저 처리한다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ktb-ai-hackathon-team14.com www.ktb-ai-hackathon-team14.com;

    ssl_certificate     /etc/letsencrypt/live/ktb-ai-hackathon-team14.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ktb-ai-hackathon-team14.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 51m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # X-Forwarded-Proto가 https로 넘어가야 Spring이 {baseUrl}을 https로 만든다
    # (application.yml의 forward-headers-strategy: framework 와 짝).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /oauth2/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
