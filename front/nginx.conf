# ALB(ACM)가 TLS를 종료하고 EC2로는 평문 HTTP로 넘기는 구성을 기본으로 한다.
# EC2에서 직접 TLS를 붙이는 경우는 nginx.tls.conf 참고.

# ALB가 붙여 보낸 X-Forwarded-Proto 를 그대로 전달하기 위한 매핑.
#
# 주의: 여기서 $scheme 을 쓰면 안 된다. ALB→EC2 구간은 http 라서 $scheme 은 항상
# "http" 이고, 그러면 Spring 이 카카오 redirect_uri 를 http:// 로 만들어 KOE006 이 난다.
# 헤더가 있으면 그 값을(=브라우저가 실제로 쓴 스킴), 없으면(로컬 직접 접속) $scheme 을 쓴다.
map $http_x_forwarded_proto $client_proto {
    default            $scheme;
    "~^https?$"        $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 51m;

    # ALB 타깃 그룹 헬스체크용. 백엔드 상태까지 반영한다.
    location = /healthz {
        access_log off;
        proxy_pass http://backend:8080/actuator/health;
        proxy_set_header Host $http_host;
    }

    # Let's Encrypt HTTP-01 챌린지 (ALB를 안 쓰고 EC2에서 직접 발급할 때만 사용).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # SPA 라우팅: 없는 경로는 index.html로
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE(상담 실시간 스트림). 정규식 location 이라 아래 /api/ 보다 우선 매칭된다.
    #   - proxy_buffering off: 켜져 있으면 delta 이벤트가 nginx 버퍼에 갇혀
    #     화면이 멈춘 것처럼 보인다.
    #   - proxy_read_timeout: SseEmitter 타임아웃이 120초라 그보다 길게 잡는다.
    location ~ ^/api/v1/consultations/[^/]+/events$ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
        proxy_set_header Connection        "";

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 180s;
        add_header X-Accel-Buffering no;
    }

    # 백엔드 프록시. Host 를 그대로 넘겨야 Spring 이 카카오 redirect_uri 를
    # 브라우저가 보는 도메인으로 만든다.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
    }

    location /oauth2/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
    }
}
