openapi: 3.1.0
info:
  title: 관계온도 API
  version: 1.2.0
  summary: 카카오톡 대화 기반 관계 건강도 분석 및 AI 상담 API
  description: |
    관계 등록, 카카오톡 대화 업로드, 비동기 PRQC 분석, 주간 대시보드,
    인물별 리포트와 근거 기반 AI 상담을 제공하는 MVP API 계약이다.

    브라우저 세션은 HttpOnly 쿠키를 사용한다. 상태 변경 요청은 세션 쿠키와
    X-CSRF-Token을 모두 요구한다. 점수와 AI 답변은 진단이 아닌 참고 정보다.

    프론트엔드-백엔드 분석은 비동기 Job이지만 Backend Worker-AI 서버 호출은
    MVP에서 동기 방식이다. Job의 stage와 progress는 백엔드 오케스트레이션
    기준의 예상값이다. AI 서버는 PRQC 6요소와 근거를 반환하고 백엔드는
    버전된 관계 유형별 정책으로 canonical overall.score를 계산한다.

    업로드한 카카오톡 파일은 백엔드가 검증·파싱하고 정규화 메시지를 MongoDB에
    저장한다. 분석 Worker는 MongoDB 메시지를 NDJSON gzip으로 생성하여 내부
    AI 서버에 multipart/form-data로 전달한다.
servers:
  - url: /api/v1
    description: 현재 호스트의 v1 API
tags:
  - name: Auth
    description: 카카오 OAuth와 세션
  - name: Users
    description: 현재 사용자
  - name: Dashboard
    description: 주간 대시보드 집계
  - name: Relationships
    description: 인물과 관계
  - name: Conversation Files
    description: 카카오톡 대화 파일
  - name: Check-ins
    description: 주관적 관계 체크인
  - name: Analyses
    description: 비동기 대화 분석
  - name: Reports
    description: PRQC 리포트
  - name: Consultations
    description: AI 상담방과 메시지
  - name: Support Resources
    description: 검증된 상담 지원 정보
security:
  - cookieAuth: []
paths:
  /auth/kakao/authorize:
    get:
      tags: [Auth]
      operationId: startKakaoAuthorization
      summary: 카카오 로그인 시작
      security: []
      parameters:
        - name: redirectUri
          in: query
          required: true
          description: 로그인 후 이동할 allowlist 등록 프론트엔드 URL
          schema:
            type: string
            format: uri
      responses:
        "302":
          description: 카카오 인증 화면으로 이동
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/kakao/callback:
    get:
      tags: [Auth]
      operationId: handleKakaoCallback
      summary: 카카오 OAuth 콜백 처리
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: 세션 쿠키 설정 후 프론트엔드로 이동
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
            Set-Cookie:
              schema:
                type: string
                example: rt_session=opaque; HttpOnly; Secure; SameSite=Lax; Path=/
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 로그아웃
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "204":
          description: 세션 폐기 완료
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: 현재 사용자와 CSRF 토큰 조회
      responses:
        "200":
          description: 현재 사용자
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: 주간 관계 대시보드 조회
      description: |
        선택 주차까지 완료된 관계별 최신 리포트로 카드와 평균을 집계한다.
        미래 주차의 리포트와 분석 이력이 없는 관계는 제외한다.
      parameters:
        - name: weekOf
          in: query
          description: 포함 주차를 찾기 위한 날짜. 생략 시 사용자 타임존의 현재 날짜.
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: 주간 요약, 관계 카드, 변화 상위, 주의 관계
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /relationships:
    get:
      tags: [Relationships]
      operationId: listRelationships
      summary: 관계 목록 조회 및 이름 검색
      parameters:
        - name: search
          in: query
          schema:
            type: string
            maxLength: 50
        - $ref: "#/components/parameters/Sort"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/RelationshipStatus"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 관계 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Relationships]
      operationId: createRelationship
      summary: 신규 관계 초안 생성
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRelationshipRequest"
      responses:
        "201":
          description: 관계 생성 완료
          headers:
            Location:
              schema:
                type: string
                example: /api/v1/relationships/0198c8a7-7f49-7a35-b7a7-8e81b4db0281
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipDetailEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /relationships/{relationshipId}:
    parameters:
      - $ref: "#/components/parameters/RelationshipId"
    get:
      tags: [Relationships]
      operationId: getRelationship
      summary: 관계 기본정보 조회
      responses:
        "200":
          description: 관계 기본정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipDetailEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Relationships]
      operationId: updateRelationship
      summary: 관계 이름 또는 유형 수정
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRelationshipRequest"
      responses:
        "200":
          description: 수정된 관계
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipDetailEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Relationships]
      operationId: deleteRelationship
      summary: 관계 및 파생 데이터 삭제 요청
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "202":
          description: 비동기 삭제 요청 접수
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionEnvelope"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /relationships/{relationshipId}/conversation-files:
    parameters:
      - $ref: "#/components/parameters/RelationshipId"
    post:
      tags: [Conversation Files]
      operationId: uploadConversationFile
      summary: 카카오톡 대화 내보내기 파일 업로드
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, source, selfParticipantName]
              properties:
                file:
                  type: string
                  format: binary
                  description: 카카오톡 내보내기 `.txt` 또는 `.csv`, 최대 50MB
                source:
                  type: string
                  const: KAKAO_TALK
                selfParticipantName:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: 대화 참여자 중 현재 사용자의 카카오톡 표시 이름
      responses:
        "201":
          description: |
            업로드, 형식 검증 및 파싱 완료. 파싱한 메시지는 MongoDB에 저장한다.
            공개 응답에는 원본 또는 정규화 파일의 저장 경로, Presigned URL,
            다운로드 자격증명을 포함하지 않는다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationFileEnvelope"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          description: 50MB 초과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: 지원하지 않는 파일 형식
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /conversation-files/{fileId}:
    parameters:
      - $ref: "#/components/parameters/FileId"
    get:
      tags: [Conversation Files]
      operationId: getConversationFile
      summary: 업로드 파일 검증 상태 조회
      responses:
        "200":
          description: 파일 메타데이터. 원문 다운로드 URL은 제공하지 않는다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationFileEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Conversation Files]
      operationId: deleteConversationFile
      summary: 업로드 파일 삭제
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "204":
          description: 삭제 완료
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /relationships/{relationshipId}/check-ins:
    parameters:
      - $ref: "#/components/parameters/RelationshipId"
    get:
      tags: [Check-ins]
      operationId: listCheckIns
      summary: 관계별 주차 체크인 이력 조회
      description: 주차 시작일(월요일) 기준 최신순으로 반환한다.
      security:
        - cookieAuth: []
      parameters:
        - name: from
          in: query
          required: false
          description: 조회할 주차 시작일의 최솟값(포함)
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: 조회할 주차 시작일의 최댓값(포함)
          schema:
            type: string
            format: date
      responses:
        "200":
          description: 체크인 이력 조회 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInListEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Check-ins]
      operationId: createCheckIn
      summary: 1~7점 주관적 체크인 저장
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckInRequest"
      responses:
        "201":
          description: 해당 주차 체크인 최초 저장 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInEnvelope"
        "200":
          description: 해당 주차의 기존 체크인 갱신 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /relationships/{relationshipId}/analyses:
    parameters:
      - $ref: "#/components/parameters/RelationshipId"
    post:
      tags: [Analyses]
      operationId: startAnalysis
      summary: 대화 분석 Job 시작
      description: |
        백엔드가 Job을 생성하고 Queue에 등록한 뒤 즉시 202를 반환한다.
        Backend Worker는 MongoDB에서 파싱 메시지를 조회하고 정규화 NDJSON gzip을
        생성한 뒤 multipart/form-data로 AI 서버를 동기 호출한다.
        checkInId는 분석 시점 연결용 메타데이터이며 MVP 점수 계산이나 AI 입력에
        사용하지 않는다. Queue 등록 자체가 불가능한 경우에만 요청 단계에서
        503 ANALYSIS_UNAVAILABLE을 반환할 수 있다.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartAnalysisRequest"
      responses:
        "202":
          description: 분석 작업 접수
          headers:
            Location:
              schema:
                type: string
                example: /api/v1/analysis-jobs/0198c8a7-3000-7000-8000-000000000001
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisJobEnvelope"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /analysis-jobs/{jobId}:
    get:
      tags: [Analyses]
      operationId: getAnalysisJob
      summary: 분석 진행률 및 완료 결과 조회
      description: |
        stage와 progress는 AI 서버가 보고한 실제 내부 진행률이 아니라 백엔드가
        파일 준비, AI 호출, 결과 저장 상태를 기준으로 계산한 UI 표시용 예상값이다.
        현재 구현은 대화 로딩 10, 메시지 패턴 30, 감정 흐름 60, PRQC 계산 80,
        종합점수 계산 및 저장 95, 성공 완료 100을 사용한다. 리포트가 저장되고
        SUCCEEDED가 된 경우에만 100을 반환한다. 접수 후 내부 AI 호출이 실패해도
        이 API는 200과 status=FAILED, failure 객체를 반환한다.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: 분석 Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisJobEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /relationships/{relationshipId}/report:
    get:
      tags: [Reports]
      operationId: getRelationshipReport
      summary: 인물별 PRQC 리포트 조회
      parameters:
        - $ref: "#/components/parameters/RelationshipId"
        - name: weeks
          in: query
          description: 최신 리포트의 주차를 포함한 조회 범위. 화면에서는 4주 또는 8주를 권장한다.
          schema:
            type: integer
            minimum: 4
            maximum: 52
            default: 8
      responses:
        "200":
          description: 종합점수, PRQC, 근거, 추이
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 완료된 리포트가 없음 (`REPORT_REQUIRED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /consultations:
    get:
      tags: [Consultations]
      operationId: listConsultations
      summary: 최근 상담방 목록 조회
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 상담방 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultationListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Consultations]
      operationId: createConsultation
      summary: 새 AI 상담 시작
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConsultationRequest"
      responses:
        "201":
          description: 상담방과 첫 AI 메시지 생성
          headers:
            Location:
              schema:
                type: string
                example: /api/v1/consultations/0198c8a7-5000-7000-8000-000000000001
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultationEnvelope"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /consultations/{consultationId}:
    parameters:
      - $ref: "#/components/parameters/ConsultationId"
    get:
      tags: [Consultations]
      operationId: getConsultation
      summary: 상담방 상세 조회
      responses:
        "200":
          description: 상담방 상세
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultationEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Consultations]
      operationId: deleteConsultation
      summary: 상담방과 메시지 삭제
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "204":
          description: 삭제 완료
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /consultations/{consultationId}/messages:
    parameters:
      - $ref: "#/components/parameters/ConsultationId"
    get:
      tags: [Consultations]
      operationId: listConsultationMessages
      summary: 상담 메시지 이력 조회
      parameters:
        - name: before
          in: query
          description: 이 메시지 이전의 더 오래된 메시지 조회
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: 메시지 목록. 서버는 최신순으로 반환하고 클라이언트는 시간순 표시 가능.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageListEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Consultations]
      operationId: createConsultationMessage
      summary: 사용자 메시지 저장 및 AI 답변 생성 시작
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageRequest"
      responses:
        "202":
          description: 사용자 메시지와 생성 중 AI 메시지
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageAcceptedEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /consultations/{consultationId}/events:
    get:
      tags: [Consultations]
      operationId: streamConsultationEvents
      summary: AI 답변 Server-Sent Events 스트림
      parameters:
        - $ref: "#/components/parameters/ConsultationId"
        - name: after
          in: query
          description: 이 사용자 메시지 이후 생성 이벤트
          schema:
            type: string
            format: uuid
        - name: Last-Event-ID
          in: header
          description: SSE 재연결 시 마지막으로 처리한 이벤트 ID
          schema:
            type: string
      responses:
        "200":
          description: |
            assistant.started, assistant.delta, assistant.completed,
            assistant.failed, heartbeat 이벤트를 전송한다.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-cache
          content:
            text/event-stream:
              schema:
                type: string
              example: |-
                event: assistant.delta
                id: evt_01
                data: {"messageId":"0198c8a7-6000-7000-8000-000000000002","delta":"그럴 수 있어요."}

                event: assistant.completed
                id: evt_02
                data: {"message":{"id":"0198c8a7-6000-7000-8000-000000000002","role":"ASSISTANT","content":"그럴 수 있어요.","status":"COMPLETED","evidenceRefs":[],"safetyNotice":null,"createdAt":"2026-08-19T11:47:03Z"}}
        "404":
          $ref: "#/components/responses/NotFound"

  /support-resources:
    get:
      tags: [Support Resources]
      operationId: listSupportResources
      summary: 검증된 전문상담 및 지원 리소스 조회
      parameters:
        - name: region
          in: query
          schema:
            type: string
            default: KR
            maxLength: 10
        - name: category
          in: query
          schema:
            type: string
            enum: [MENTAL_HEALTH_COUNSELING, RELATIONSHIP_COUNSELING, CRISIS_SUPPORT]
      responses:
        "200":
          description: 검수된 지원 리소스
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportResourceListEnvelope"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: rt_session
      description: HttpOnly Secure 세션 쿠키
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: /users/me에서 받은 CSRF 토큰

  parameters:
    RelationshipId:
      name: relationshipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConsultationId:
      name: consultationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Sort:
      name: sort
      in: query
      schema:
        type: string
        enum: [ABS_CHANGE_DESC, SCORE_DESC, SCORE_ASC, UPDATED_DESC]
        default: ABS_CHANGE_DESC
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 16
        maxLength: 128

  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: 로그인 필요 또는 세션 만료
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: CSRF 검증 실패 또는 접근 권한 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: 리소스 상태 또는 멱등성 충돌
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnprocessableEntity:
      description: 의미 검증 실패
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TooManyRequests:
      description: 호출 한도 초과
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: 분석 또는 AI 공급자 일시 장애
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    Uuid:
      type: string
      format: uuid
    DateTime:
      type: string
      format: date-time
    Score:
      type: integer
      minimum: 0
      maximum: 100
    NullableScore:
      type: [integer, "null"]
      minimum: 0
      maximum: 100
    ScoreChange:
      type: [integer, "null"]
      minimum: -100
      maximum: 100

    RelationshipType:
      type: string
      enum: [ROMANTIC_PARTNER, FRIEND, FAMILY, COWORKER, OTHER]
    RelationshipStatus:
      type: string
      enum: [DRAFT, ANALYZING, ACTIVE, ANALYSIS_FAILED, DELETING]
    ScoreStatusCode:
      type: string
      enum: [HEALTHY, GOOD, NEEDS_ATTENTION, CHANGE_DETECTED]
    AnalysisJobStatus:
      type: string
      enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELED]
    AnalysisStage:
      type: string
      enum:
        - LOADING_CONVERSATION
        - ANALYZING_MESSAGE_PATTERNS
        - ANALYZING_EMOTIONAL_FLOW
        - CALCULATING_PRQC
        - CALCULATING_RELATIONSHIP_SCORE
    ChatRole:
      type: string
      enum: [USER, ASSISTANT]
    MessageStatus:
      type: string
      enum: [GENERATING, COMPLETED, FAILED]

    ErrorField:
      type: object
      additionalProperties: false
      required: [field, reason]
      properties:
        field:
          type: string
        reason:
          type: string
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ErrorField"
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"

    PageMeta:
      type: object
      additionalProperties: false
      required: [nextCursor, hasNext]
      properties:
        nextCursor:
          type: [string, "null"]
        hasNext:
          type: boolean

    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, displayName, timezone, csrfToken, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        displayName:
          type: string
        profileImageUrl:
          type: [string, "null"]
          format: uri
        timezone:
          type: string
          example: Asia/Seoul
        csrfToken:
          type: string
        createdAt:
          $ref: "#/components/schemas/DateTime"
    CurrentUserEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/CurrentUser"

    RelationshipIdentity:
      type: object
      additionalProperties: false
      required: [id, name, initial, relationshipType]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          minLength: 1
          maxLength: 50
        initial:
          type: string
          minLength: 1
          maxLength: 2
        relationshipType:
          $ref: "#/components/schemas/RelationshipType"
    RelationshipSummary:
      allOf:
        - $ref: "#/components/schemas/RelationshipIdentity"
        - type: object
          required: [status, score, change, lastAnalyzedAt, sparkline]
          properties:
            status:
              $ref: "#/components/schemas/RelationshipStatus"
            score:
              $ref: "#/components/schemas/NullableScore"
            statusCode:
              oneOf:
                - $ref: "#/components/schemas/ScoreStatusCode"
                - type: "null"
            statusLabel:
              type: [string, "null"]
            change:
              $ref: "#/components/schemas/ScoreChange"
            lastAnalyzedAt:
              type: [string, "null"]
              format: date-time
            sparkline:
              type: array
              maxItems: 52
              items:
                $ref: "#/components/schemas/Score"
    RelationshipDetail:
      allOf:
        - $ref: "#/components/schemas/RelationshipIdentity"
        - type: object
          required: [status, createdAt, updatedAt]
          properties:
            status:
              $ref: "#/components/schemas/RelationshipStatus"
            createdAt:
              $ref: "#/components/schemas/DateTime"
            updatedAt:
              $ref: "#/components/schemas/DateTime"
    CreateRelationshipRequest:
      type: object
      additionalProperties: false
      required: [name, relationshipType]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        relationshipType:
          $ref: "#/components/schemas/RelationshipType"
    UpdateRelationshipRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        relationshipType:
          $ref: "#/components/schemas/RelationshipType"
    RelationshipDetailEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/RelationshipDetail"
    RelationshipListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RelationshipSummary"
        meta:
          $ref: "#/components/schemas/PageMeta"

    DashboardWeek:
      type: object
      additionalProperties: false
      required: [startDate, endDate, label]
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        label:
          type: string
    DashboardSummary:
      type: object
      additionalProperties: false
      description: 관계 카드 전체의 점수 평균과, null이 아닌 변화량의 평균을 반올림한 주간 요약
      required: [relationshipCount, averageScore, averageChange]
      properties:
        relationshipCount:
          type: integer
          minimum: 0
        averageScore:
          $ref: "#/components/schemas/NullableScore"
        averageChange:
          $ref: "#/components/schemas/ScoreChange"
    LargestChange:
      type: object
      additionalProperties: false
      required: [relationshipId, name, change, sparkline]
      properties:
        relationshipId:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        change:
          type: integer
          minimum: -100
          maximum: 100
        sparkline:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/Score"
    AttentionItem:
      type: object
      additionalProperties: false
      required: [relationshipId, name, score, reasonCode, reasonLabel]
      properties:
        relationshipId:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        score:
          $ref: "#/components/schemas/Score"
        reasonCode:
          type: string
          enum: [LOW_SCORE, LARGE_DROP, SCORE_AND_DROP]
        reasonLabel:
          type: string
    Dashboard:
      type: object
      additionalProperties: false
      required: [week, summary, relationships, largestChanges, needsAttention]
      properties:
        week:
          $ref: "#/components/schemas/DashboardWeek"
        summary:
          $ref: "#/components/schemas/DashboardSummary"
        relationships:
          type: array
          description: 선택 주차까지 완료된 관계별 최신 리포트 카드. 스파크라인은 최근 8주 주차별 최신점수다.
          items:
            $ref: "#/components/schemas/RelationshipSummary"
        largestChanges:
          type: array
          description: 변화량 절댓값 내림차순 상위 3개. 변화량이 null인 관계는 제외한다.
          maxItems: 3
          items:
            $ref: "#/components/schemas/LargestChange"
        needsAttention:
          type: array
          description: 점수 60 미만 또는 전주 대비 변화량 -10 이하인 관계
          items:
            $ref: "#/components/schemas/AttentionItem"
    DashboardEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Dashboard"

    ConversationFile:
      type: object
      additionalProperties: false
      required:
        - id
        - relationshipId
        - originalFileName
        - sizeBytes
        - source
        - selfParticipantName
        - otherParticipantName
        - validationStatus
        - messageCount
        - conversationStartedAt
        - conversationEndedAt
        - expiresAt
        - uploadedAt
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        relationshipId:
          $ref: "#/components/schemas/Uuid"
        originalFileName:
          type: string
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 52428800
        source:
          type: string
          const: KAKAO_TALK
        selfParticipantName:
          type: string
          maxLength: 100
          description: 업로드 요청에서 지정하고 파싱 결과로 확인된 현재 사용자 이름
        otherParticipantName:
          type: string
          maxLength: 100
          description: 파싱 결과로 확인된 상대 참여자 이름
        validationStatus:
          type: string
          enum: [VALIDATING, VALID, INVALID]
        messageCount:
          type: integer
          minimum: 0
        conversationStartedAt:
          type: string
          format: date-time
        conversationEndedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        uploadedAt:
          $ref: "#/components/schemas/DateTime"
    ConversationFileEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/ConversationFile"

    CheckInQuestionCode:
      type: string
      enum: [RELATIONSHIP_FEELING, CONVERSATION_COMFORT]
    CheckInAnswer:
      type: object
      additionalProperties: false
      required: [questionCode, score]
      properties:
        questionCode:
          $ref: "#/components/schemas/CheckInQuestionCode"
        score:
          type: integer
          minimum: 1
          maximum: 7
    CreateCheckInRequest:
      type: object
      additionalProperties: false
      required: [answers]
      properties:
        answers:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/CheckInAnswer"
    CheckIn:
      type: object
      additionalProperties: false
      required: [id, relationshipId, answers, weekStart, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        relationshipId:
          $ref: "#/components/schemas/Uuid"
        answers:
          type: array
          items:
            $ref: "#/components/schemas/CheckInAnswer"
        weekStart:
          type: string
          format: date
        createdAt:
          $ref: "#/components/schemas/DateTime"
        updatedAt:
          $ref: "#/components/schemas/DateTime"
    CheckInEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/CheckIn"
    CheckInListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CheckIn"
        meta:
          $ref: "#/components/schemas/PageMeta"

    StartAnalysisRequest:
      type: object
      additionalProperties: false
      required: [conversationFileId, checkInId]
      properties:
        conversationFileId:
          $ref: "#/components/schemas/Uuid"
        checkInId:
          description: 분석 당시 체크인 연결용 메타데이터. MVP AI 입력 및 점수 산식에서는 제외한다.
          $ref: "#/components/schemas/Uuid"
    AnalysisFailure:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
    AnalysisJob:
      type: object
      additionalProperties: false
      required:
        - id
        - relationshipId
        - status
        - stage
        - progress
        - reportId
        - failure
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        relationshipId:
          $ref: "#/components/schemas/Uuid"
        status:
          $ref: "#/components/schemas/AnalysisJobStatus"
        stage:
          $ref: "#/components/schemas/AnalysisStage"
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            백엔드 오케스트레이션 기준의 UI 표시용 예상 진행률.
            LOADING_CONVERSATION=10, ANALYZING_MESSAGE_PATTERNS=30,
            ANALYZING_EMOTIONAL_FLOW=60, CALCULATING_PRQC=80,
            CALCULATING_RELATIONSHIP_SCORE=95이며 status=SUCCEEDED일 때만 100이다.
        estimatedSecondsRemaining:
          type: [integer, "null"]
          minimum: 0
          description: 정확히 추정할 수 없으면 null
        reportId:
          type: [string, "null"]
          format: uuid
        failure:
          oneOf:
            - $ref: "#/components/schemas/AnalysisFailure"
            - type: "null"
        createdAt:
          $ref: "#/components/schemas/DateTime"
        updatedAt:
          $ref: "#/components/schemas/DateTime"
    AnalysisJobEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AnalysisJob"

    OverallScore:
      type: object
      additionalProperties: false
      description: AI PRQC 결과에 백엔드의 버전된 관계 유형별 가중치를 적용한 canonical 종합점수
      required: [score, change, statusCode, statusLabel]
      properties:
        score:
          $ref: "#/components/schemas/Score"
        change:
          description: 직전 주의 최신 리포트 대비 변화량. 직전 주 리포트가 없으면 null
          $ref: "#/components/schemas/ScoreChange"
        statusCode:
          $ref: "#/components/schemas/ScoreStatusCode"
        statusLabel:
          type: string
    PrqcScores:
      type: object
      additionalProperties: false
      description: AI 서버가 대화 데이터에서 산출한 PRQC 6개 구성요소 점수
      required: [satisfaction, commitment, intimacy, trust, passion, love]
      properties:
        satisfaction:
          $ref: "#/components/schemas/Score"
        commitment:
          $ref: "#/components/schemas/Score"
        intimacy:
          $ref: "#/components/schemas/Score"
        trust:
          $ref: "#/components/schemas/Score"
        passion:
          $ref: "#/components/schemas/Score"
        love:
          $ref: "#/components/schemas/Score"
    EvidenceMetric:
      type: object
      additionalProperties: false
      required: [name, currentValue, previousValue, unit, period]
      properties:
        name:
          type: string
        currentValue:
          type: number
        previousValue:
          type: [number, "null"]
        unit:
          type: string
        period:
          type: string
    Evidence:
      type: object
      additionalProperties: false
      required: [id, component, score, summary]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        component:
          type: string
          enum: [satisfaction, commitment, intimacy, trust, passion, love]
        score:
          $ref: "#/components/schemas/Score"
        summary:
          type: string
        metric:
          oneOf:
            - $ref: "#/components/schemas/EvidenceMetric"
            - type: "null"
    TrendPoint:
      type: object
      additionalProperties: false
      description: 한 주에 분석이 여러 번 있으면 가장 최근 완료 리포트 한 건만 포함한다.
      required: [weekStart, label, score]
      properties:
        weekStart:
          type: string
          format: date
          description: 분석에 연결된 체크인의 주차 시작일(월요일)
        label:
          type: string
        score:
          $ref: "#/components/schemas/Score"
    RelationshipReport:
      type: object
      additionalProperties: false
      required:
        - id
        - relationship
        - overall
        - prqc
        - evidences
        - trend
        - analyzedAt
        - modelVersion
        - scoringPolicyVersion
        - selfReportComparison
        - disclaimer
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        relationship:
          $ref: "#/components/schemas/RelationshipIdentity"
        overall:
          $ref: "#/components/schemas/OverallScore"
        prqc:
          $ref: "#/components/schemas/PrqcScores"
        evidences:
          type: array
          items:
            $ref: "#/components/schemas/Evidence"
        trend:
          type: array
          minItems: 0
          maxItems: 52
          items:
            $ref: "#/components/schemas/TrendPoint"
        analyzedAt:
          $ref: "#/components/schemas/DateTime"
        modelVersion:
          type: string
          pattern: ^prqc-[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+$
          example: prqc-2026-08-19.1
          description: AI PRQC 분석 모델 버전
        scoringPolicyVersion:
          type: string
          pattern: ^relationship-temperature-[0-9]+\.[0-9]+\.[0-9]+$
          example: relationship-temperature-1.0.0
          description: 백엔드의 관계 유형별 종합점수 가중치 정책 버전
        selfReportComparison:
          type: string
          maxLength: 2000
          description: 사용자의 체크인 자기보고와 대화 기반 PRQC 분석에서 관찰된 신호의 일치·차이를 설명하는 문구
        disclaimer:
          type: string
          description: 리포트 생성 시점에 저장된 비진단 면책문구
    ReportEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/RelationshipReport"

    CreateConsultationRequest:
      type: object
      additionalProperties: false
      required: [relationshipId]
      properties:
        relationshipId:
          $ref: "#/components/schemas/Uuid"
    ConsultationSummary:
      type: object
      additionalProperties: false
      required: [id, relationship, lastMessagePreview, lastMessageAt, unreadCount]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        relationship:
          $ref: "#/components/schemas/RelationshipIdentity"
        lastMessagePreview:
          type: [string, "null"]
          maxLength: 160
        lastMessageAt:
          type: [string, "null"]
          format: date-time
        unreadCount:
          type: integer
          minimum: 0
    Consultation:
      allOf:
        - $ref: "#/components/schemas/ConsultationSummary"
        - type: object
          required: [reportId, createdAt, updatedAt]
          properties:
            reportId:
              $ref: "#/components/schemas/Uuid"
            createdAt:
              $ref: "#/components/schemas/DateTime"
            updatedAt:
              $ref: "#/components/schemas/DateTime"
            initialMessage:
              oneOf:
                - $ref: "#/components/schemas/ChatMessage"
                - type: "null"
    ConsultationEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Consultation"
    ConsultationListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ConsultationSummary"
        meta:
          $ref: "#/components/schemas/PageMeta"

    CreateMessageRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4000
    EvidenceReference:
      type: object
      additionalProperties: false
      required: [evidenceId, label]
      properties:
        evidenceId:
          type: string
        label:
          type: string
    ResourceQuery:
      type: object
      additionalProperties: false
      required: [category, region]
      properties:
        category:
          type: string
          enum: [MENTAL_HEALTH_COUNSELING, RELATIONSHIP_COUNSELING, CRISIS_SUPPORT]
        region:
          type: string
    SafetyNotice:
      type: object
      additionalProperties: false
      required: [type, title, message, resourceQuery]
      properties:
        type:
          type: string
          enum: [SUPPORT_RECOMMENDATION, CRISIS_SUPPORT]
        title:
          type: string
        message:
          type: string
        resourceQuery:
          $ref: "#/components/schemas/ResourceQuery"
    ChatMessage:
      type: object
      additionalProperties: false
      required: [id, role, content, status, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        role:
          $ref: "#/components/schemas/ChatRole"
        content:
          type: string
          maxLength: 20000
        status:
          $ref: "#/components/schemas/MessageStatus"
        evidenceRefs:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceReference"
        safetyNotice:
          oneOf:
            - $ref: "#/components/schemas/SafetyNotice"
            - type: "null"
        createdAt:
          $ref: "#/components/schemas/DateTime"
    MessageListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        meta:
          $ref: "#/components/schemas/PageMeta"
    MessageAccepted:
      type: object
      additionalProperties: false
      required: [userMessage, assistantMessage, streamUrl]
      properties:
        userMessage:
          $ref: "#/components/schemas/ChatMessage"
        assistantMessage:
          $ref: "#/components/schemas/ChatMessage"
        streamUrl:
          type: string
    MessageAcceptedEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/MessageAccepted"

    SupportResource:
      type: object
      additionalProperties: false
      required: [id, name, description, category, region, verifiedAt, source]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [MENTAL_HEALTH_COUNSELING, RELATIONSHIP_COUNSELING, CRISIS_SUPPORT]
        region:
          type: string
        url:
          type: [string, "null"]
          format: uri
        phone:
          type: [string, "null"]
        hours:
          type: [string, "null"]
        verifiedAt:
          $ref: "#/components/schemas/DateTime"
        source:
          type: string
    SupportResourceListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SupportResource"

    DeletionJob:
      type: object
      additionalProperties: false
      required: [id, status, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        status:
          type: string
          enum: [QUEUED, RUNNING, SUCCEEDED, FAILED]
        createdAt:
          $ref: "#/components/schemas/DateTime"
    DeletionEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/DeletionJob"
