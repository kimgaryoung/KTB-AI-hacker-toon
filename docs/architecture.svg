<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1130" viewBox="0 0 1080 1130" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, sans-serif">
  <rect width="1080" height="1130" fill="#ffffff"/>

  <!-- 사용자 브라우저 -->
  <rect x="412" y="62" width="252" height="76" rx="8" fill="#fafafa" stroke="#c9c9c9" stroke-width="1.5"/>
  <text x="538" y="108" text-anchor="middle" font-size="20" font-weight="700" fill="#1f1f1f">사용자 브라우저</text>

  <line x1="538" y1="138" x2="538.0" y2="181.0" stroke="#8a8a8a" stroke-width="1.8"/>
  <text x="554" y="170" font-size="17" fill="#444">HTTPS :443</text>

  <!-- Route53 -->
  <rect x="96" y="196" width="252" height="84" rx="8" fill="#e6f4ee" stroke="#2e8b6a" stroke-width="1.8"/>
  <text x="222" y="229" text-anchor="middle" font-size="20" font-weight="700" fill="#1f3d31">Route53</text>
  <text x="222" y="258" text-anchor="middle" font-size="16" fill="#2e8b6a">A 레코드 (Alias)</text>
  <line x1="348" y1="238" x2="389.0" y2="238.0" stroke="#8a8a8a" stroke-width="1.8"/>

  <!-- ALB -->
  <rect x="402" y="196" width="272" height="84" rx="8" fill="#e6f4ee" stroke="#2e8b6a" stroke-width="1.8"/>
  <text x="538" y="229" text-anchor="middle" font-size="20" font-weight="700" fill="#1f3d31">ALB</text>
  <text x="538" y="258" text-anchor="middle" font-size="16" fill="#2e8b6a">ACM 인증서 · TLS 종료</text>

  <line x1="538" y1="280" x2="538.0" y2="413.0" stroke="#8a8a8a" stroke-width="1.8"/>
  <text x="554" y="334" font-size="17" fill="#444">HTTP :80 · VPC 내부 평문</text>

  <!-- EC2 box -->
  <rect x="64" y="378" width="950" height="522" rx="10" fill="#fbfbfb" stroke="#c9c9c9" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="90" y="416" font-size="19" font-weight="700" fill="#1f1f1f">EC2 1대 · 도커 컴포즈</text>

  <!-- front -->
  <rect x="380" y="426" width="316" height="84" rx="8" fill="#efecff" stroke="#6f5ce6" stroke-width="1.8"/>
  <text x="538" y="459" text-anchor="middle" font-size="20" font-weight="700" fill="#2d2466">front :80</text>
  <text x="538" y="488" text-anchor="middle" font-size="16" fill="#6f5ce6">nginx · 정적 서빙 · 프록시</text>
  <line x1="538" y1="510" x2="538.0" y2="575.0" stroke="#8a8a8a" stroke-width="1.8"/>

  <!-- backend -->
  <rect x="412" y="588" width="252" height="84" rx="8" fill="#efecff" stroke="#6f5ce6" stroke-width="1.8"/>
  <text x="538" y="621" text-anchor="middle" font-size="20" font-weight="700" fill="#2d2466">backend :8080</text>
  <text x="538" y="650" text-anchor="middle" font-size="16" fill="#6f5ce6">Spring Boot</text>
  <line x1="664" y1="630" x2="729.0" y2="630.0" stroke="#8a8a8a" stroke-width="1.8"/>

  <!-- ai -->
  <rect x="742" y="588" width="256" height="84" rx="8" fill="#efecff" stroke="#6f5ce6" stroke-width="1.8"/>
  <text x="870" y="621" text-anchor="middle" font-size="20" font-weight="700" fill="#2d2466">ai :8000</text>
  <text x="870" y="650" text-anchor="middle" font-size="16" fill="#6f5ce6">FastAPI · Gemini 호출</text>

  <!-- backend -> postgres / mongo -->
  <line x1="478" y1="672" x2="389.9" y2="758.3" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="598" y1="672" x2="686.1" y2="758.3" stroke="#8a8a8a" stroke-width="1.8"/>

  <!-- postgres -->
  <rect x="254" y="768" width="236" height="84" rx="8" fill="#efecff" stroke="#6f5ce6" stroke-width="1.8"/>
  <text x="372" y="801" text-anchor="middle" font-size="20" font-weight="700" fill="#2d2466">postgres</text>
  <text x="372" y="830" text-anchor="middle" font-size="16" fill="#6f5ce6">앱 DB · 세션</text>

  <!-- mongo -->
  <rect x="586" y="768" width="236" height="84" rx="8" fill="#efecff" stroke="#6f5ce6" stroke-width="1.8"/>
  <text x="704" y="801" text-anchor="middle" font-size="20" font-weight="700" fill="#2d2466">mongo</text>
  <text x="704" y="830" text-anchor="middle" font-size="16" fill="#6f5ce6">분석 원문</text>

  <!-- ai -> Gemini -->
  <line x1="870" y1="672" x2="870.0" y2="935.0" stroke="#8a8a8a" stroke-width="1.8"/>

  <!-- Gemini -->
  <rect x="742" y="948" width="256" height="78" rx="8" fill="#efeee8" stroke="#8a8a7a" stroke-width="1.8"/>
  <text x="870" y="980" text-anchor="middle" font-size="20" font-weight="700" fill="#2b2b2b">Gemini API</text>
  <text x="870" y="1008" text-anchor="middle" font-size="16" fill="#5a5a4e">외부 호출 (443)</text>

  <!-- legend -->
  <rect x="64" y="1048" width="24" height="24" rx="5" fill="#e6f4ee" stroke="#2e8b6a" stroke-width="1.6"/>
  <text x="102" y="1066" font-size="17" fill="#2b2b2b">AWS 관리형</text>
  <rect x="284" y="1048" width="24" height="24" rx="5" fill="#efecff" stroke="#6f5ce6" stroke-width="1.6"/>
  <text x="322" y="1066" font-size="17" fill="#2b2b2b">도커 컨테이너</text>
  <rect x="538" y="1048" width="24" height="24" rx="5" fill="#efeee8" stroke="#8a8a7a" stroke-width="1.6"/>
  <text x="576" y="1066" font-size="17" fill="#2b2b2b">외부 서비스</text>
  <polygon points="538.0,192.0 532.5,181.0 543.5,181.0" fill="#8a8a8a"/>
  <polygon points="400.0,238.0 389.0,243.5 389.0,232.5" fill="#8a8a8a"/>
  <polygon points="538.0,424.0 532.5,413.0 543.5,413.0" fill="#8a8a8a"/>
  <polygon points="538.0,586.0 532.5,575.0 543.5,575.0" fill="#8a8a8a"/>
  <polygon points="740.0,630.0 729.0,635.5 729.0,624.5" fill="#8a8a8a"/>
  <polygon points="382.0,766.0 386.0,754.4 393.7,762.2" fill="#8a8a8a"/>
  <polygon points="694.0,766.0 682.3,762.2 690.0,754.4" fill="#8a8a8a"/>
  <polygon points="870.0,946.0 864.5,935.0 875.5,935.0" fill="#8a8a8a"/>
</svg>
