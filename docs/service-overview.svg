<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">관계온도 서비스 기능 안내</title>
  <desc id="desc">대화와 체크인 데이터를 AI가 분석하고, 관계 리포트와 AI 상담으로 연결하는 관계온도 서비스 흐름</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0821"/>
      <stop offset="0.5" stop-color="#17103b"/>
      <stop offset="1" stop-color="#271957"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241452"/>
      <stop offset="1" stop-color="#8a4cae"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2151"/>
      <stop offset="1" stop-color="#1d173d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#174b9b" flood-opacity=".14"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#174b9b" flood-opacity=".13"/>
    </filter>
    <style>
      .kr { font-family: Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif; }
      .navy { fill: #f7f1ff; }
      .muted { fill: #b5a9d3; }
      .blue { fill: #f0a9df; }
      .white { fill: #fff; }
      .bold { font-weight: 800; }
      .semi { font-weight: 700; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="34" fill="url(#bg)"/>
  <circle cx="1420" cy="120" r="220" fill="#6b3b9e" opacity=".22"/>
  <circle cx="1540" cy="760" r="280" fill="#ee8fc8" opacity=".10"/>
  <path d="M0 805 C280 710 460 820 690 775 S1110 675 1600 790 V900 H0Z" fill="#17103b" opacity=".8"/>
  <path d="M0 850 C270 765 470 870 720 828 S1150 730 1600 830" fill="none" stroke="#b15cbb" stroke-width="18" opacity=".7"/>
  <!-- star field and orbital accents -->
  <g fill="#fff" opacity=".82">
    <circle cx="64" cy="68" r="2"/><circle cx="210" cy="148" r="1.5"/><circle cx="344" cy="48" r="2"/><circle cx="482" cy="180" r="1.5"/>
    <circle cx="720" cy="72" r="2"/><circle cx="860" cy="150" r="1.5"/><circle cx="972" cy="48" r="2"/><circle cx="1210" cy="118" r="1.5"/>
    <circle cx="1510" cy="54" r="2"/><circle cx="1470" cy="330" r="1.5"/><circle cx="1020" cy="780" r="2"/><circle cx="720" cy="744" r="1.5"/>
    <circle cx="240" cy="760" r="2"/><circle cx="70" cy="640" r="1.5"/><circle cx="900" cy="870" r="2"/><circle cx="1320" cy="820" r="1.5"/>
  </g>
  <g fill="#f5b4e4" opacity=".85"><circle cx="430" cy="300" r="2"/><circle cx="790" cy="280" r="2"/><circle cx="1380" cy="420" r="2"/><circle cx="1120" cy="72" r="2"/></g>
  <ellipse cx="1330" cy="220" rx="220" ry="72" fill="none" stroke="#d88fc9" stroke-width="3" opacity=".26" transform="rotate(-18 1330 220)"/>
  <circle cx="1330" cy="220" r="48" fill="#d99bca" opacity=".9"/>
  <circle cx="1315" cy="204" r="9" fill="#f2c9e4" opacity=".8"/><circle cx="1348" cy="232" r="7" fill="#b774ae" opacity=".7"/>

  <g class="kr">
    <text x="100" y="112" font-size="26" class="blue bold" letter-spacing="5">WOULDU · RELATIONSHIP UNIVERSE</text>
    <text x="100" y="210" font-size="88" class="navy bold">WouldU</text>
    <text x="104" y="270" font-size="37" class="blue bold">관계의 우주를 이해하는 AI</text>
    <text x="106" y="318" font-size="23" class="muted">대화 기록과 체크인을 분석해 관계의 온도를 보여주고</text>
    <text x="106" y="352" font-size="23" class="muted">필요한 순간에는 리포트 기반 AI 상담으로 이어집니다.</text>

    <!-- left feature cards -->
    <g filter="url(#shadow)">
      <rect x="100" y="414" width="410" height="270" rx="28" fill="url(#card)" stroke="#59457d" stroke-width="2"/>
      <rect x="545" y="414" width="410" height="270" rx="28" fill="url(#card)" stroke="#59457d" stroke-width="2"/>
    </g>

    <!-- analysis icon -->
    <g transform="translate(140 452)">
      <rect width="76" height="76" rx="20" fill="#e1efff"/>
      <path d="M22 17h25l10 10v31H22z" fill="#fff" stroke="#126ee8" stroke-width="4"/>
      <path d="M47 17v13h13M31 39h18M31 49h23" fill="none" stroke="#126ee8" stroke-width="4" stroke-linecap="round"/>
      <circle cx="55" cy="58" r="16" fill="#ffbf19" stroke="#fff" stroke-width="4"/>
      <path d="m49 58 4 4 8-9" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="140" y="575" font-size="31" class="navy bold">AI 관계 분석</text>
    <text x="140" y="615" font-size="20" class="muted">대화 + 주간 체크인</text>
    <text x="140" y="646" font-size="20" class="muted">PRQC 6개 항목 · 종합 관계 온도</text>
    <text x="140" y="676" font-size="20" class="blue semi">변화량과 근거까지 한눈에</text>

    <!-- chat icon -->
    <g transform="translate(585 452)">
      <rect width="76" height="76" rx="20" fill="#fff1ce"/>
      <path d="M18 25c0-7 6-12 14-12h20c8 0 14 5 14 12v16c0 7-6 12-14 12H39l-13 10 2-10h-2c-5 0-8-5-8-12z" fill="#ffbf19" stroke="#e59d00" stroke-width="3"/>
      <circle cx="36" cy="33" r="3" fill="#fff"/><circle cx="46" cy="33" r="3" fill="#fff"/><circle cx="56" cy="33" r="3" fill="#fff"/>
    </g>
    <text x="585" y="575" font-size="31" class="navy bold">AI 상담</text>
    <text x="585" y="615" font-size="20" class="muted">관계 리포트를 바탕으로</text>
    <text x="585" y="646" font-size="20" class="muted">질문에 실시간 스트리밍 답변</text>
    <text x="585" y="676" font-size="20" class="blue semi">근거 있는 대화 · 안전 신호 감지</text>

    <!-- right flow panel -->
    <g filter="url(#shadow)">
      <rect x="1010" y="92" width="500" height="650" rx="34" fill="#1e173e" stroke="#59457d" stroke-width="2" opacity=".96"/>
    </g>
    <text x="1060" y="148" font-size="25" class="blue bold">서비스 이용 흐름</text>
    <text x="1060" y="184" font-size="19" class="muted">입력부터 상담까지 하나의 경험으로 연결</text>

    <!-- flow nodes -->
    <g filter="url(#soft)">
      <rect x="1060" y="224" width="400" height="88" rx="20" fill="#292050" stroke="#49376e"/>
      <rect x="1060" y="360" width="400" height="88" rx="20" fill="#292050" stroke="#49376e"/>
      <rect x="1060" y="496" width="400" height="88" rx="20" fill="#32254b" stroke="#6b4a72"/>
      <rect x="1060" y="632" width="400" height="72" rx="20" fill="#213d46" stroke="#3d6c6b"/>
    </g>

    <!-- upload icon -->
    <g transform="translate(1085 246)">
      <rect width="44" height="44" rx="12" fill="#126ee8"/>
      <path d="M13 22h18M22 13v18M12 34h20" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="1150" y="260" font-size="24" class="navy bold">1. 대화와 체크인 입력</text>
    <text x="1150" y="289" font-size="17" class="muted">대화 파일 업로드 · 주간 감정 기록</text>

    <!-- AI icon -->
    <g transform="translate(1085 382)">
      <rect width="44" height="44" rx="12" fill="#126ee8"/>
      <rect x="10" y="12" width="24" height="20" rx="7" fill="#fff"/>
      <circle cx="17" cy="22" r="2.5" fill="#126ee8"/><circle cx="27" cy="22" r="2.5" fill="#126ee8"/>
      <path d="M22 8v4M16 33v4M28 33v4" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text x="1150" y="396" font-size="24" class="navy bold">2. AI가 관계를 분석</text>
    <text x="1150" y="425" font-size="17" class="muted">PRQC 6개 지표와 관계 온도 계산</text>

    <!-- report icon -->
    <g transform="translate(1085 518)">
      <rect width="44" height="44" rx="12" fill="#ffbf19"/>
      <path d="M13 12h18v22H13zM17 19h10M17 25h10M17 31h6" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="1150" y="532" font-size="24" class="navy bold">3. 리포트와 변화 확인</text>
    <text x="1150" y="561" font-size="17" class="muted">전주 대비 변화 · 최근 8주 추이 · 근거</text>

    <!-- chat icon -->
    <g transform="translate(1085 646)">
      <rect width="44" height="44" rx="12" fill="#28a56a"/>
      <path d="M12 17c0-4 3-7 7-7h10c4 0 7 3 7 7v8c0 4-3 7-7 7h-8l-6 5 1-5h-1c-2 0-3-3-3-7z" fill="#fff"/>
      <circle cx="21" cy="21" r="2" fill="#28a56a"/><circle cx="27" cy="21" r="2" fill="#28a56a"/><circle cx="33" cy="21" r="2" fill="#28a56a"/>
    </g>
    <text x="1150" y="675" font-size="24" class="navy bold">4. 리포트 기반 AI 상담</text>

    <!-- arrows -->
    <path d="M1260 316v35M1260 452v35M1260 588v35" fill="none" stroke="#126ee8" stroke-width="5" stroke-linecap="round"/>
    <path d="m1252 342 8 10 8-10M1252 478l8 10 8-10M1252 614l8 10 8-10" fill="none" stroke="#126ee8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- mascot / visual accent -->
    <g transform="translate(1460 710)">
      <circle cx="0" cy="0" r="34" fill="#ffbf19" opacity=".95"/>
      <path d="M-15 -3c4 8 10 12 17 12 7 0 13-4 17-12" fill="none" stroke="#09285f" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-11" cy="-12" r="4" fill="#09285f"/><circle cx="13" cy="-12" r="4" fill="#09285f"/>
    </g>
    <text x="108" y="835" font-size="24" fill="#fff" class="bold">당신의 관계도, 하나의 별처럼 빛날 수 있도록.</text>
    <text x="1468" y="842" font-size="17" fill="#fff" text-anchor="end" opacity=".86">WouldU</text>
  </g>
</svg>
